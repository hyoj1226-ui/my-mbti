<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>
  <style>
    :root {
      --poke-red: #EE1515;
      --poke-red-hover: #C40B0B;
      --poke-dark: #222224;
      --poke-white: #FFFFFF;
      --poke-bg: #F8F9FA;
      --poke-yellow: #FFCC03;
      --poke-blue: #3B5BA7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: var(--poke-bg);
      background-image: radial-gradient(#EE1515 0.8px, transparent 0.8px), radial-gradient(#222224 0.8px, #F8F9FA 0.8px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      color: var(--poke-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--poke-white);
      max-width: 550px;
      width: 100%;
      border-radius: 28px;
      border: 4px solid var(--poke-dark);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      overflow: hidden;
      position: relative;
    }

    /* 상단 몬스터볼 테마 헤더 */
    .header {
      background-color: var(--poke-red);
      padding: 28px 20px 22px;
      text-align: center;
      border-bottom: 6px solid var(--poke-dark);
      position: relative;
    }

    /* 몬스터볼 중앙 버튼 장식 */
    .header::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 26px;
      height: 26px;
      background-color: var(--poke-white);
      border: 5px solid var(--poke-dark);
      border-radius: 50%;
      z-index: 10;
      box-shadow: 0 0 0 3px var(--poke-white);
    }

    /* 인라인 몬스터볼 & 포켓몬 스타일 타이틀 */
    .pokemon-title-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .logo-text {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 2.3rem;
      color: var(--poke-yellow);
      letter-spacing: 1px;
      -webkit-text-stroke: 2px var(--poke-blue);
      text-shadow: 3px 3px 0 var(--poke-dark);
      transform: skewX(-6deg);
    }

    .content {
      padding: 32px 24px 28px;
      text-align: center;
    }

    .subtitle {
      font-size: 1.25rem;
      color: #444;
      margin-bottom: 24px;
      font-weight: 700;
    }

    /* MBTI 버튼 그리드 */
    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .mbti-btn {
      background-color: var(--poke-white);
      border: 3px solid var(--poke-dark);
      border-radius: 14px;
      padding: 16px 8px;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--poke-dark);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 var(--poke-dark);
    }

    .mbti-btn:hover {
      background-color: var(--poke-red);
      color: var(--poke-white);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--poke-dark);
    }

    .mbti-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--poke-dark);
    }

    /* 결과 화면 */
    .result-card {
      display: none;
      animation: popIn 0.35s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .mbti-badge {
      display: inline-block;
      background-color: var(--poke-red);
      color: var(--poke-white);
      font-size: 1.2rem;
      font-weight: 800;
      padding: 6px 22px;
      border-radius: 20px;
      border: 2px solid var(--poke-dark);
      margin-bottom: 12px;
    }

    .pokemon-img-box {
      width: 210px;
      height: 210px;
      margin: 10px auto 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .pokemon-img-box::before {
      content: '';
      position: absolute;
      width: 170px;
      height: 170px;
      background-color: #FFF2A8;
      border: 3px dashed #F1C40F;
      border-radius: 50%;
      z-index: 1;
    }

    .pokemon-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.18));
    }

    .pokemon-emoji-fallback {
      font-size: 6rem;
      position: relative;
      z-index: 2;
      display: none;
    }

    .pokemon-name {
      font-size: 1.85rem;
      font-weight: 900;
      color: var(--poke-dark);
      margin-bottom: 16px;
    }

    .reason-box {
      background-color: #F8F9FA;
      border: 3px solid var(--poke-dark);
      border-radius: 16px;
      padding: 18px;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #333;
      margin-bottom: 18px;
      text-align: left;
      word-break: keep-all;
    }

    .match-box {
      background-color: #FFF0F0;
      border: 2px solid var(--poke-red);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--poke-red);
      margin-bottom: 24px;
    }

    .reset-btn {
      background-color: var(--poke-red);
      border: 3px solid var(--poke-dark);
      border-radius: 18px;
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--poke-white);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 5px 0 var(--poke-dark);
      width: 100%;
      max-width: 280px;
    }

    .reset-btn:hover {
      background-color: var(--poke-red-hover);
      transform: translateY(-2px);
      box-shadow: 0 7px 0 var(--poke-dark);
    }

    .reset-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--poke-dark);
    }

    @media (max-width: 480px) {
      .mbti-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .logo-text { font-size: 1.8rem; }
      .pokemon-img-box { width: 170px; height: 170px; }
      .pokemon-img-box::before { width: 140px; height: 140px; }
      .subtitle { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 헤더 영역 -->
    <div class="header">
      <div class="pokemon-title-logo">
        <svg width="38" height="38" viewBox="0 0 100 100" style="vertical-align: middle;">
          <circle cx="50" cy="50" r="45" fill="#EE1515" stroke="#222224" stroke-width="8"/>
          <path d="M 5,50 A 45,45 0 0,0 95,50 Z" fill="#FFFFFF" stroke="#222224" stroke-width="8"/>
          <line x1="5" y1="50" x2="95" y2="50" stroke="#222224" stroke-width="8"/>
          <circle cx="50" cy="50" r="14" fill="#FFFFFF" stroke="#222224" stroke-width="8"/>
        </svg>
        <span class="logo-text">Pokémon</span>
      </div>
    </div>

    <div class="content">
      <!-- 1. MBTI 선택 화면 -->
      <div id="selection-screen">
        <h2 class="subtitle">나의 MBTI 유형을 선택해 주세요!</h2>
        <div class="mbti-grid" id="mbti-grid
