<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>
  <style>
    /* 포켓몬 테마 색상 (빨강, 하양, 검은 테두리, 노랑 포인트) */
    :root {
      --poke-red: #EE1515;
      --poke-red-hover: #C40B0B;
      --poke-dark: #222224;
      --poke-white: #FFFFFF;
      --poke-bg: #F8F9FA;
      --poke-yellow: #FFDE00;
      --poke-card-border: #222224;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: var(--poke-bg);
      /* 포켓몬 스타일 도트 배경 패턴 */
      background-image: radial-gradient(#EE1515 0.8px, transparent 0.8px), radial-gradient(#222224 0.8px, #F8F9FA 0.8px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      color: var(--poke-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--poke-white);
      max-width: 550px;
      width: 100%;
      border-radius: 28px;
      border: 4px solid var(--poke-dark);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      overflow: hidden;
      position: relative;
    }

    /* 상단 몬스터볼 테마 헤더 */
    .header {
      background-color: var(--poke-red);
      padding: 28px 20px 22px;
      text-align: center;
      border-bottom: 6px solid var(--poke-dark);
      position: relative;
    }

    /* 헤더 중앙 몬스터볼 버튼 장식 */
    .header::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 24px;
      background-color: var(--poke-white);
      border: 5px solid var(--poke-dark);
      border-radius: 50%;
      z-index: 10;
    }

    /* 포켓몬 로고 이미지 */
    .pokemon-logo {
      width: 210px;
      max-width: 80%;
      height: auto;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }

    .content {
      padding: 32px 24px 28px;
      text-align: center;
    }

    .subtitle {
      font-size: 1.25rem;
      color: #444;
      margin-bottom: 24px;
      font-weight: 700;
    }

    /* MBTI 버튼 그리드 */
    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .mbti-btn {
      background-color: var(--poke-white);
      border: 3px solid var(--poke-dark);
      border-radius: 14px;
      padding: 16px 8px;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--poke-dark);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 var(--poke-dark);
    }

    .mbti-btn:hover {
      background-color: var(--poke-red);
      color: var(--poke-white);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--poke-dark);
    }

    .mbti-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--poke-dark);
    }

    /* 결과 화면 */
    .result-card {
      display: none;
      animation: popIn 0.35s ease-out;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .mbti-badge {
      display: inline-block;
      background-color: var(--poke-red);
      color: var(--poke-white);
      font-size: 1.2rem;
      font-weight: 800;
      padding: 6px 20px;
      border-radius: 20px;
      border: 2px solid var(--poke-dark);
      margin-bottom: 12px;
    }

    /* 포켓몬 이미지 원형 배경 */
    .pokemon-img-box {
      width: 210px;
      height: 210px;
      margin: 10px auto 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .pokemon-img-box::before {
      content: '';
      position: absolute;
      width: 170px;
      height: 170px;
      background-color: #FFF2A8;
      border: 3px dashed #F1C40F;
      border-radius: 50%;
      z-index: 1;
    }

    .pokemon-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 2;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.18));
    }

    .pokemon-name {
      font-size: 1.85rem;
      font-weight: 900;
      color: var(--poke-dark);
      margin-bottom: 16px;
    }

    /* 이유 설명 박스 */
    .reason-box {
      background-color: #F8F9FA;
      border: 3px solid var(--poke-dark);
      border-radius: 16px;
      padding: 18px;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #333;
      margin-bottom: 18px;
      text-align: left;
      word-break: keep-all;
    }

    /* 궁합 박스 */
    .match-box {
      background-color: #FFF0F0;
      border: 2px solid var(--poke-red);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--poke-red);
      margin-bottom: 24px;
    }

    /* 다시 고르기 버튼 */
    .reset-btn {
      background-color: var(--poke-red);
      border: 3px solid var(--poke-dark);
      border-radius: 18px;
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--poke-white);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 5px 0 var(--poke-dark);
      width: 100%;
      max-width: 280px;
    }

    .reset-btn:hover {
      background-color: var(--poke-red-hover);
      transform: translateY(-2px);
      box-shadow: 0 7px 0 var(--poke-dark);
    }

    .reset-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--poke-dark);
    }

    /* 모바일 가로폭 대응 */
    @media (max-width: 480px) {
      .mbti-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .pokemon-logo { width: 170px; }
      .pokemon-img-box { width: 17
